---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: spartan-os
description: Fedora Kinoite KDE with multimedia, development, virtualization and broad application support
base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    install:
      packages:
        # Administração e utilitários
        - micro
        - fastfetch
        - htop
        - git
        - git-lfs
        - curl
        - wget
        - unzip
        - p7zip
        - btop
        - lm_sensors
        - usbutils
        - pciutils
        - smartmontools
        - fwupd

        # Desenvolvimento
        - gcc
        - gcc-c++
        - make
        - cmake
        - ninja-build
        - python3
        - python3-pip
        - nodejs
        - rust
        - cargo

        # Contêineres
        - podman
        - distrobox

        # Virtualização
        - qemu-kvm
        - libvirt
        - virt-install
        - virt-manager
        - virt-viewer
        - edk2-ovmf
        - swtpm

  - type: default-flatpaks
    configurations:
      - scope: system
        notify: true
        install:
          # Navegação e multimídia
          - org.mozilla.firefox
          - org.videolan.VLC
          - org.qbittorrent.qBittorrent
          - com.stremio.Stremio

          # Programas Windows
          - com.usebottles.bottles

          # Administração e personalização
          - com.github.tchx84.Flatseal

          # Jogos e compatibilidade
          - com.valvesoftware.Steam
          - net.lutris.Lutris
          - com.heroicgameslauncher.hgl

      - scope: user

  - type: signing
